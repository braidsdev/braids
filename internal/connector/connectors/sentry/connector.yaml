name: sentry
description: Application monitoring and error tracking platform
category: observability
tags: [monitoring, errors, performance, debugging]
version: "1.0"
base_url: https://sentry.io/api/0
openapi_url: https://raw.githubusercontent.com/getsentry/sentry-api-schema/main/openapi-derefed.json
auth:
  type: bearer
  token_field: auth_token
pagination:
  type: link_header
resources:
  projects:
    path: /projects/
    method: GET
  issues:
    path: /projects/{organization_slug}/{project_slug}/issues/
    method: GET
  events:
    path: /projects/{organization_slug}/{project_slug}/events/
    method: GET
